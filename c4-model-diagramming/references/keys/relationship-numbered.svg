<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" width="260" height="90" role="img" aria-label="Key: Numbered relationship" font-family='"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif' fill="var(--ink)">
<title>Key: Numbered relationship</title>
<style>svg{--ground:#F7F6F3;--raised:#FFFFFF;--sunk:#EDEBE6;--ink:#1A1D23;--ink-soft:#3D434E;--muted:#6B7285;--rule:#DCD9D2;--primary:#2E7D76;--primary-soft:#D7EBE8;--accent:#B77914;--accent-soft:#F5E6C9;--person:#5B5FA8;--person-soft:#E2E3F4}@media (prefers-color-scheme:dark){svg{--ground:#12151A;--raised:#191D24;--sunk:#0D1014;--ink:#E8E6E1;--ink-soft:#BFC3CC;--muted:#8B92A5;--rule:#272C36;--primary:#4FA8A0;--primary-soft:#102A28;--accent:#E0A33E;--accent-soft:#33280F;--person:#9BA0E0;--person-soft:#1A1B33}}</style>
<defs><marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
<rect width="260" height="90" fill="var(--ground)"/>
<polyline points="20,40 240,40" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#c4-arrow)"/><text x="140" y="28" font-size="11.5" text-anchor="middle" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">Looks up the order</text><text x="140" y="41" font-size="10" text-anchor="middle" fill="var(--muted)" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">[SQL]</text><circle cx="28" cy="40" r="11" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.4"/><text x="28" y="44" font-size="11" font-weight="800" text-anchor="middle">1</text></svg>
