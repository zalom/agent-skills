<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-label="System context diagram for the order desk" font-family='"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif' fill="var(--ink)">
<title>System context diagram for the order desk</title>
<style>svg{--ground:#F7F6F3;--raised:#FFFFFF;--sunk:#EDEBE6;--ink:#1A1D23;--ink-soft:#3D434E;--muted:#6B7285;--rule:#DCD9D2;--primary:#2E7D76;--primary-soft:#D7EBE8;--accent:#B77914;--accent-soft:#F5E6C9;--person:#5B5FA8;--person-soft:#E2E3F4}@media (prefers-color-scheme:dark){svg{--ground:#12151A;--raised:#191D24;--sunk:#0D1014;--ink:#E8E6E1;--ink-soft:#BFC3CC;--muted:#8B92A5;--rule:#272C36;--primary:#4FA8A0;--primary-soft:#102A28;--accent:#E0A33E;--accent-soft:#33280F;--person:#9BA0E0;--person-soft:#1A1B33}}</style>
<defs><marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
<rect width="920" height="460" fill="var(--ground)"/>
<text x="30" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--muted)">SYSTEM CONTEXT</text><text x="30" y="51" font-size="12.5" fill="var(--ink-soft)">Order desk · who uses it and what it talks to</text><rect x="60" y="156" width="150" height="114" rx="18" style="fill:var(--person-soft);stroke:var(--person)" stroke-width="1.4"/><circle cx="135.0" cy="139" r="29" style="fill:var(--person-soft);stroke:var(--person)" stroke-width="1.4"/><line x1="90" y1="227" x2="90" y2="260" stroke="var(--muted)" stroke-width="0.8" opacity="0.6"/><line x1="180" y1="227" x2="180" y2="260" stroke="var(--muted)" stroke-width="0.8" opacity="0.6"/><text x="135.0" y="182" font-size="16" font-weight="700" text-anchor="middle">Sales agent</text><text x="135.0" y="200" font-size="13" text-anchor="middle">[Person]</text><text x="135.0" y="220" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">Confirms orders</text><text x="135.0" y="235" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">for customers</text><rect x="360" y="130" width="220" height="110" rx="6" style="fill:var(--primary-soft);stroke:var(--primary)" stroke-width="1.4"/><text x="470.0" y="154" font-size="16" font-weight="700" text-anchor="middle">Order desk</text><text x="470.0" y="172" font-size="13" text-anchor="middle">[Software system]</text><text x="470.0" y="192" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">Answers questions about</text><text x="470.0" y="207" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">customer orders</text><rect x="720" y="80" width="170" height="80" rx="6" style="fill:var(--sunk);stroke:var(--muted)" stroke-width="1.4"/><text x="805.0" y="104" font-size="16" font-weight="700" text-anchor="middle">ERP</text><text x="805.0" y="122" font-size="13" text-anchor="middle">[External system]</text><text x="805.0" y="142" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">Orders, stock, invoices</text><rect x="720" y="190" width="170" height="80" rx="6" style="fill:var(--sunk);stroke:var(--muted)" stroke-width="1.4"/><text x="805.0" y="214" font-size="16" font-weight="700" text-anchor="middle">Company sign-in</text><text x="805.0" y="232" font-size="13" text-anchor="middle">[External system]</text><text x="805.0" y="252" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">Identity provider</text><rect x="720" y="320" width="170" height="80" rx="6" style="fill:var(--sunk);stroke:var(--muted)" stroke-width="1.4"/><text x="805.0" y="344" font-size="16" font-weight="700" text-anchor="middle">Email service</text><text x="805.0" y="362" font-size="13" text-anchor="middle">[External system]</text><text x="805.0" y="382" font-size="12.5" text-anchor="middle" fill="var(--ink-soft)">Delivers notices</text><polyline points="210,190 360,190" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#c4-arrow)"/><text x="285" y="172" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">Asks about orders</text><text x="285" y="186" font-size="11.5" text-anchor="middle" fill="var(--muted)" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">[HTTPS]</text><path d="M580 160 L640 160 L640 120 L720 120" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#c4-arrow)"/><text x="655" y="108" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">Reads orders from</text><text x="655" y="122" font-size="11.5" text-anchor="middle" fill="var(--muted)" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">[REST/JSON]</text><polyline points="580,230 720,230" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#c4-arrow)"/><text x="650" y="218" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">Verifies users with</text><text x="650" y="232" font-size="11.5" text-anchor="middle" fill="var(--muted)" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">[OpenID Connect]</text><path d="M490 240 L490 360 L720 360" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#c4-arrow)"/><text x="605" y="348" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">Sends daily digests through</text><text x="605" y="362" font-size="11.5" text-anchor="middle" fill="var(--muted)" style="paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round">[SMTP]</text><text x="30" y="440" font-size="13" font-weight="700">Key</text><rect x="70" y="428" width="26" height="16" rx="3" style="fill:var(--person-soft);stroke:var(--person)" stroke-width="1.5"/><text x="103" y="440" font-size="13">Person</text><rect x="167" y="428" width="26" height="16" rx="3" style="fill:var(--primary-soft);stroke:var(--primary)" stroke-width="1.5"/><text x="200" y="440" font-size="13">Software system</text><rect x="327" y="428" width="26" height="16" rx="3" style="fill:var(--sunk);stroke:var(--muted)" stroke-width="1.5"/><text x="360" y="440" font-size="13">External system</text></svg>
